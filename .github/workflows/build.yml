name: Build Flet App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]"

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses

      # Безопасно декодируем ключ
      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      # Переносим номер сборки в переменную среды, чтобы Bash не путался в синтаксисе
      - name: Build Android APK
        env:
          BUILD_NUM: ${{ github.run_number }}
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          yes | flet build apk --project "my_flet_app" --product "My App" --org "com.example" --build-version "1.0.0" --build-number $BUILD_NUM --keystore-path "release.jks" --keystore-password "$KEY_PASS" --keystore-alias "my-key-alias"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-flet-app-apk
          path: build/apk/*.apk
