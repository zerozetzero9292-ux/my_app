name: Build Flet App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      # 1. Настраиваем Java для компилятора Android
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. ИСПРАВЛЕНО: Устанавливаем ровно ту версию Flutter, которую требует ваш Flet
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      # 3. Системные библиотеки Linux (гарантирует отсутствие конфликтов среды)
      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libegl1-mesa-dev xorg-dev

      # 4. Настраиваем среду Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 5. Ставим Flet
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]"

      # 6. Принимаем лицензии Android SDK
      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses

      # 7. ИСПРАВЛЕНО: Собираем чистый APK без лишних 'yes |', так как версии теперь совпадают идеально
      - name: Build Unsigned Android APK
        run: |
          flet build apk \
            --project "my_flet_app" \
            --product "Task RPG" \
            --org "com.example.taskrpg" \
            --build-version "1.0.${{ github.run_number }}" \
            --build-number ${{ github.run_number }}

      # 8. Надежная подпись готового APK внешним инструментом
      - name: Sign Android APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: build/apk
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: "my-key-alias"
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}

      # 9. Сохраняем подписанный APK в артефакты GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-rpg-signed-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
