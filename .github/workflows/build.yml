name: Build Flet App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build APK using Flet Action
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          project: '.'
