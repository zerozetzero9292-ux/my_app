name: Build Flet App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]"

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses

      # Жестко очищаем и вырезаем переносы строк из секретного Base64
      - name: Decode Android Keystore
        env:
          RAW_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "${RAW_KEYSTORE_BASE64}" | tr -d '\r\n ' | base64 --decode > release.jks

      # Оптимизированная сборка под одну архитектуру с выводом подробных логов
      - name: Build Android APK
        env:
          BUILD_NUM: ${{ github.run_number }}
          FLET_ANDROID_SIGNING_KEY_STORE: "release.jks"
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: "my-key-alias"
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          yes | flet build apk \
            --project "my_flet_app" \
            --product "My App" \
            --org "com.example" \
            --build-version "1.0.0" \
            --build-number $BUILD_NUM \
            --arch arm64-v8a \
            --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-flet-app-apk
          path: build/apk/*.apk
