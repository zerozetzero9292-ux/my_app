name: Build Flet App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]"

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses

      # Декодируем файл ключа и сохраняем его в корень проекта для простоты доступа
      - name: Decode Android Keystore
        env:
          RAW_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "${RAW_KEYSTORE_BASE64}" | tr -d '\r\n ' | base64 --decode > release.jks

      # Чистая сборка APK с автоматической версией и исправленными переменными
      - name: Build Android APK
        env:
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          yes | flet build apk \
            --project "my_flet_app" \
            --product "Task RPG" \
            --org "com.example.taskrpg" \
            --build-version "1.0.${{ github.run_number }}" \
            --build-number ${{ github.run_number }} \
            --android-signing-key-store "release.jks" \
            --android-signing-key-store-password "$KEY_PASS" \
            --android-signing-key-alias "my-key-alias" \
            --android-signing-key-password "$KEY_PASS"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-flet-app-apk
          path: build/apk/*.apk
